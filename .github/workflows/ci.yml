name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app/api
    env:
      DATABASE_URL: postgres://postgres:thu@127.0.0.1:5432/dr
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/api
      - name: Môi trường thử
        working-directory: app
        run: |
          thu/chuan-bi.sh | tee /tmp/chuan-bi.txt
          grep '^AZURITE_SAS_DOC=' /tmp/chuan-bi.txt >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: sqlx-cli
        run: cargo install sqlx-cli@0.8.6 --locked --no-default-features --features postgres,rustls
      - run: cargo sqlx migrate run
      - run: cargo sqlx prepare --check -- --all-targets
      - run: cargo test --all-targets
      - run: cargo test --release --test tai -- --ignored --nocapture
      - name: OpenAPI khớp với tệp đã commit
        run: |
          cargo run --quiet -- --in-openapi > /tmp/openapi.json
          diff -u openapi.json /tmp/openapi.json
      - name: Image, kích thước và thời gian khởi động
        working-directory: app
        run: |
          docker compose --profile api build --build-arg PHIEN_BAN=${GITHUB_SHA::7} api
          echo "image_mb=$(docker image inspect dr-app-api --format '{{.Size}}' | awk '{printf "%.1f", $1/1048576}')" >> "$GITHUB_STEP_SUMMARY"
          T0=$(date +%s%3N)
          docker compose --profile api up -d api
          until curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; do sleep 0.1; done
          echo "khoi_dong_ms=$(( $(date +%s%3N) - T0 ))" >> "$GITHUB_STEP_SUMMARY"
      - name: Đẩy image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: app/api
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag dr-app-api "ghcr.io/${{ github.repository_owner }}/dr-api:${GITHUB_SHA}"
          docker tag dr-app-api "ghcr.io/${{ github.repository_owner }}/dr-api:main"
          docker push "ghcr.io/${{ github.repository_owner }}/dr-api:${GITHUB_SHA}"
          docker push "ghcr.io/${{ github.repository_owner }}/dr-api:main"
