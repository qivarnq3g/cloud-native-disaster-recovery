name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/api
    env:
      DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/dr
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/api
      - name: Môi trường thử
        working-directory: app
        run: |
          dev/setup.sh | tee /tmp/setup.txt
          grep '^AZURITE_READ_SAS=' /tmp/setup.txt >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: sqlx-cli
        run: cargo install sqlx-cli@0.8.6 --locked --no-default-features --features postgres,rustls
      - run: cargo sqlx migrate run
      - run: cargo sqlx prepare --check -- --all-targets
      - run: cargo test --all-targets
      - run: cargo test --release --test load -- --ignored --nocapture
      - name: OpenAPI khớp với tệp đã commit
        run: |
          cargo run --quiet -- --print-openapi > /tmp/openapi.json
          diff -u openapi.json /tmp/openapi.json
      - name: Image, kích thước và thời gian khởi động
        working-directory: app
        run: |
          docker compose --profile api build --build-arg APP_VERSION=${GITHUB_SHA::7} api
          echo "image_mb=$(docker image inspect dr-app-api --format '{{.Size}}' | awk '{printf "%.1f", $1/1048576}')" >> "$GITHUB_STEP_SUMMARY"
          T0=$(date +%s%3N)
          docker compose --profile api up -d api
          until curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; do sleep 0.1; done
          echo "startup_ms=$(( $(date +%s%3N) - T0 ))" >> "$GITHUB_STEP_SUMMARY"
      - name: Lưu image cho job web
        working-directory: app
        run: docker save dr-app-api | gzip > /tmp/dr-app-api.tar.gz
      - uses: actions/upload-artifact@v5
        with:
          name: api-image
          path: /tmp/dr-app-api.tar.gz
          retention-days: 1
      - name: Đẩy image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: app/api
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag dr-app-api "ghcr.io/${{ github.repository_owner }}/dr-api:${GITHUB_SHA}"
          docker tag dr-app-api "ghcr.io/${{ github.repository_owner }}/dr-api:main"
          docker push "ghcr.io/${{ github.repository_owner }}/dr-api:${GITHUB_SHA}"
          docker push "ghcr.io/${{ github.repository_owner }}/dr-api:main"

  web:
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app/web
    env:
      PUBLIC_API_URL: http://127.0.0.1:8080
      PUBLIC_API_READY: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - name: Kiểu sinh từ OpenAPI khớp với tệp đã commit
        run: |
          npm run gen-types
          git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/download-artifact@v5
        with:
          name: api-image
          path: /tmp
      - name: API thử trong Docker
        working-directory: app
        run: |
          gunzip -c /tmp/dr-app-api.tar.gz | docker load
          dev/setup.sh
          docker compose --profile api up -d --no-build api
          until curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; do sleep 1; done
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: web-report
          path: |
            app/web/playwright-report
            app/web/test-results
            app/web/.lighthouseci

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Terraform fmt, validate, test
        run: |
          [ -d infra/terraform ] || { echo "chưa có infra/terraform"; exit 0; }
          terraform fmt -check -recursive infra/terraform
          for d in infra/terraform/*/; do
            compgen -G "$d*.tf" > /dev/null || continue
            echo "== $d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            terraform -chdir="$d" test
          done
      - name: Test script
        run: python -m pytest tests/scripts -q || [ $? -eq 5 ]

  deploy:
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/web
    env:
      PUBLIC_API_URL: https://api.dr.qivarn.id.vn
      PUBLIC_API_READY: ${{ vars.API_READY == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Đẩy bản dựng sang dr-preview
        env:
          DEPLOY_KEY: ${{ secrets.DR_PREVIEW_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/dr_preview
          chmod 600 ~/.ssh/dr_preview
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/dr_preview -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone --depth 1 git@github.com:qivarnq3g/dr-preview.git /tmp/dr-preview
          rsync -a --delete --exclude .git --exclude README.md dist/ /tmp/dr-preview/
          cd /tmp/dr-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Dựng từ ${GITHUB_SHA::7}"
          git push origin main
      - name: Kiểm tra trang đã lên
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://dr.qivarn.id.vn/ready.json | grep -q "\"ready\":${PUBLIC_API_READY}"; then
              curl -fsS -o /dev/null -w '%{http_code}\n' https://dr.qivarn.id.vn/view/
              exit 0
            fi
            sleep 10
          done
          exit 1
