name: dr-app
services:
  csdl:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: thu
      POSTGRES_DB: dr
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dr"]
      interval: 2s
      timeout: 2s
      retries: 30
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
    ports: ["10000:10000"]
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=64
    volumes:
      - ./thu/s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["8333:8333"]
