# Cần sẵn trong namespace: Secret db-app-user (username, password; CNPG dùng cùng Secret này),
# Secret api-secret-code (SECRET_CODE), ConfigMap api-site (CLUSTER, REGION,
# IMAGE_STORE_CONTAINER, IMAGE_STORE_READ_ONLY: khác nhau giữa cụm chính và cụm dự phòng).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  template:
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: api
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-app-user
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-app-user
                  key: password
            - name: DATABASE_URL
              value: postgres://$(DB_USER):$(DB_PASSWORD)@db-rw:5432/dr
            - name: SECRET_CODE
              valueFrom:
                secretKeyRef:
                  name: api-secret-code
                  key: SECRET_CODE
          envFrom:
            - configMapRef:
                name: api-site
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
