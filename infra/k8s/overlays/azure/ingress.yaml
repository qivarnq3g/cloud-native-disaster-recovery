apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: dr-api
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.dr.qivarn.id.vn
      secretName: api-tls
  rules:
    - host: api.dr.qivarn.id.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
