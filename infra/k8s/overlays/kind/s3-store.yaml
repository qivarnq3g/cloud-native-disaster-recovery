apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: dr-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: IMAGE_STORE
              value: s3
            - name: AWS_ENDPOINT
              value: http://dr-seaweedfs:8333
            - name: AWS_ALLOW_HTTP
              value: "true"
            - name: AWS_REGION
              value: us-east-1
          envFrom:
            - configMapRef:
                name: api-site
            - secretRef:
                name: image-store
